  - name: transformers_quantization
    url: https://raw.githubusercontent.com/huggingface/transformers/main/docs/source/en/quantization/overview.md
  - name: datasets_quickstart
    url: https://raw.githubusercontent.com/huggingface/datasets/main/docs/source/quickstart.mdx
  - name: datasets_process
    url: https://raw.githubusercontent.com/huggingface/datasets/main/docs/source/process.mdx
  - name: hub_upload_models
    url: https://raw.githubusercontent.com/huggingface/huggingface_hub/main/docs/source/en/guides/upload.md
  - name: hub_model_cards
    url: https://raw.githubusercontent.com/huggingface/huggingface_hub/main/docs/source/en/guides/model-cards.md
