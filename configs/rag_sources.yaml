# Documents for the RAG corpus. Raw markdown files from public GitHub repositories.
# The license of each repository is fetched and saved next to the documents.
licenses:
  transformers: https://raw.githubusercontent.com/huggingface/transformers/main/LICENSE
  datasets: https://raw.githubusercontent.com/huggingface/datasets/main/LICENSE
  huggingface_hub: https://raw.githubusercontent.com/huggingface/huggingface_hub/main/LICENSE

documents:
